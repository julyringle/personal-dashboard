<!doctype html>
<html>
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home</title>
  <style>
    :root {
      --bg:#0B0D0F; --panel:#111418; --panel2:#171B20; --border:#292E35;
      --text:#E5E2DC; --muted:#747A80; --red:#8E2027; --amber:#A8642A;
      --steel:#536979; --violet:#66506f; --success:#4f725e;
      --radius:10px; --gap:10px; --hour:34px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;background:
      radial-gradient(circle at 88% -10%,rgba(142,32,39,.12),transparent 28%),
      radial-gradient(circle at 5% 105%,rgba(83,105,121,.08),transparent 26%),var(--bg)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .shell{max-width:1500px;margin:0 auto;padding:14px 16px 26px}
    .topbar{height:48px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);margin-bottom:12px;position:sticky;top:0;z-index:40;background:rgba(11,13,15,.94);backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:baseline;gap:9px;min-width:210px}
    .brand-main{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.17em;font-weight:800}
    .jp{font-size:11px;color:var(--muted);letter-spacing:.08em}
    .nav{display:flex;gap:5px;flex:1}
    .nav-btn,.ghost-btn,.chip,.action-btn{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:7px;transition:.15s ease}
    .nav-btn{padding:7px 11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .nav-btn:hover,.nav-btn.active,.ghost-btn:hover,.chip:hover,.chip.active{color:var(--text);border-color:#444b54;background:var(--panel2)}
    .nav-btn.active{box-shadow:inset 2px 0 0 var(--red)}
    .status{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
    .status strong{color:var(--text);font-weight:600}
    .loading{padding:70px 20px;text-align:center;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
    .panel{border:1px solid var(--border);background:linear-gradient(180deg,rgba(23,27,32,.92),rgba(17,20,24,.94));border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.16)}
    .panel-head{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 10px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.012)}
    .panel-title{display:flex;align-items:baseline;gap:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}
    .panel-title:before{content:"";width:3px;height:13px;background:var(--red);display:inline-block;border-radius:2px}
    .panel-sub{font-size:10px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .section{margin-top:10px}
    .home-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
    .span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
    .panel-body{padding:10px}
    .quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .action-btn{padding:11px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;color:var(--text);background:#12161a}
    .action-btn:hover{border-color:#4b3033;background:#181517;transform:translateY(-1px)}
    .action-btn .label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.1em;font-weight:700}
    .action-btn .mark{color:var(--red);font-size:15px}
    .habit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .habit{border:1px solid var(--border);background:#0f1215;border-radius:7px;padding:8px 9px;display:flex;align-items:center;justify-content:space-between;gap:7px;min-height:42px}
    .habit-name{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .toggle{min-width:31px;height:24px;border:1px solid #3a4048;border-radius:13px;background:#171b20;position:relative;padding:0}
    .toggle:after{content:"";width:16px;height:16px;border-radius:50%;position:absolute;top:3px;left:3px;background:#69717a;transition:.16s ease}
    .toggle.on{border-color:#6b2a30;background:#251316}
    .toggle.on:after{left:10px;background:var(--red);box-shadow:0 0 10px rgba(142,32,39,.35)}
    .task-list{display:flex;flex-direction:column}
    .task-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 2px;border-bottom:1px solid #20252b}
    .task-row:last-child{border-bottom:0}
    .task-num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#555d66}
    .task-title{font-size:12px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .task-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:var(--muted);margin-top:2px}
    .due{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#9aa1a9;white-space:nowrap}
    .due.overdue{color:#c56d72}.priority-high{color:#c56d72}.priority-medium{color:#b18d61}
    .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .metric{background:#0f1215;border:1px solid #252b31;border-radius:7px;padding:9px}
    .metric-k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
    .metric-v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;margin-top:4px;color:var(--text)}
    .metric-d{font-size:9px;color:var(--muted);margin-top:2px}
    .project-card{display:flex;flex-direction:column;gap:8px}
    .project-name{font-size:15px;font-weight:750}
    .project-summary{font-size:11px;color:#a0a6ad;line-height:1.45}
    .progress{height:5px;background:#242a30;border-radius:4px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--amber)}
    .tagline{display:flex;gap:5px;flex-wrap:wrap}.tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;padding:4px 6px;border-radius:4px;border:1px solid #313840;color:#a0a6ad;background:#111519}
    .collection-launch{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .launch-card{border:1px solid #2b3036;background:#0f1215;border-radius:7px;padding:10px;min-height:72px;position:relative;overflow:hidden}
    .launch-card:after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--violet)}
    .launch-card:hover{background:#14181d;border-color:#414851}
    .launch-title{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;font-weight:800;letter-spacing:.08em}
    .launch-jp{font-size:9px;color:var(--muted);margin-top:5px}
    .launch-note{font-size:9px;color:#59616a;margin-top:13px}
    /* calendar */
    .cal-toolbar{display:flex;gap:5px;align-items:center}.ghost-btn{padding:5px 8px;font-size:10px}
    .calendar-wrap{overflow:auto;background:#0c0f12}
    .cal-header{display:grid;grid-template-columns:52px repeat(7,minmax(105px,1fr));position:sticky;top:0;z-index:4;background:#0e1114;border-bottom:1px solid var(--border)}
    .cal-head-cell{padding:7px 5px;text-align:center;border-left:1px solid #20252a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:var(--muted)}
    .cal-head-cell.today{color:var(--text);box-shadow:inset 0 -2px 0 var(--red)}
    .cal-head-cell b{display:block;font-size:11px;color:inherit;margin-bottom:2px}
    .all-day-row,.midnight-row{display:grid;grid-template-columns:52px repeat(7,minmax(105px,1fr));border-bottom:1px solid #24292f}
    .rail-label{display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;color:#505860}
    .all-day-cell,.midnight-cell{min-height:24px;border-left:1px solid #20252a;padding:2px 3px}
    .all-chip,.mid-chip{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:3px 5px;background:#171c21;border-left:2px solid var(--steel);color:#c7c9c7;margin-bottom:2px}
    .cal-main{display:grid;grid-template-columns:52px 1fr;min-width:790px}
    .time-col{position:relative;background:#0d1013;border-right:1px solid #20252a}
    .time-label{position:absolute;right:7px;transform:translateY(-50%);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;color:#4f5760}
    .days-grid{display:grid;grid-template-columns:repeat(7,1fr);position:relative}
    .day-col{position:relative;border-right:1px solid #20252a;background:linear-gradient(180deg,rgba(255,255,255,.008),transparent)}
    .day-col.today{background:linear-gradient(180deg,rgba(142,32,39,.035),transparent 75%)}
    .hour-line{position:absolute;left:0;right:0;border-top:1px solid #1c2126}
    .half-line{position:absolute;left:0;right:0;border-top:1px dotted #171c21}
    .cal-event{position:absolute;left:4px;right:4px;min-height:14px;border:1px solid #313941;border-left:3px solid var(--steel);border-radius:4px;background:rgba(18,22,26,.96);padding:2px 4px;overflow:hidden;z-index:2}
    .cal-event:hover{z-index:7;background:#1a1f24;border-color:#4a535d}
    .ev-title{font-size:9px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ev-time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:7px;color:#747d86;margin-top:1px}
    .now-line{position:absolute;left:0;right:0;border-top:1px solid #b13d44;z-index:5;pointer-events:none}.now-line:before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#b13d44;left:-3px;top:-3px}
    /* collections */
    .collections-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:5px 0 12px}
    .page-title{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;letter-spacing:.16em;font-weight:850}
    .tabs{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:6px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;letter-spacing:.07em}
    .collection-tools{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
    .card-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
    .visual-card{border:1px solid var(--border);background:#101316;border-radius:8px;overflow:hidden;min-width:0;position:relative;transition:.15s ease}
    .visual-card:hover{transform:translateY(-2px);border-color:#424a53;box-shadow:0 12px 22px rgba(0,0,0,.2)}
    .visual-card.dim{opacity:.55}.visual-card.dim:hover{opacity:.88}
    .image-wrap{aspect-ratio:4/5;background:#0a0c0e;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #272c32;position:relative;overflow:hidden}
    .image-wrap img{width:100%;height:100%;object-fit:contain;display:block}
    .image-fallback{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:#444c55;letter-spacing:.1em;text-align:center;padding:15px}
    .card-content{padding:8px 9px 9px}
    .card-title{font-size:11px;font-weight:720;line-height:1.3;min-height:28px}
    .card-meta{margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;color:var(--muted);line-height:1.45}
    .card-price{margin-top:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:#b4b6b2}
    .card-actions{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}.card-link{padding:4px 6px;border:1px solid #30363d;border-radius:4px;font-size:8px;color:#9ea5ac}.card-link:hover{border-color:#5a626a;color:var(--text)}
    .status-mark{position:absolute;top:7px;right:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:7px;letter-spacing:.09em;padding:3px 5px;border-radius:4px;background:rgba(11,13,15,.88);border:1px solid #30363d;color:#9ba2a9;z-index:2}
    .status-mark.owned{border-color:#395143;color:#84a890}.status-mark.wanted{border-color:#5d282d;color:#bd777b}
    .soccer-card{--team:#292e35}.soccer-card:before{content:"";height:3px;background:var(--team);position:absolute;left:0;right:0;top:0;z-index:3}.soccer-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    .pokemon-card{--gen:#8e2027}.pokemon-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gen);z-index:3}
    .binder{display:flex;flex-direction:column;gap:12px}.binder-page{border:1px solid var(--border);background:#0d1013;border-radius:9px;padding:10px}.binder-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.binder-title{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;font-weight:800;letter-spacing:.08em}.binder-count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:var(--muted)}.binder-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .empty{padding:30px 10px;text-align:center;color:#59616a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}
    .error{border:1px solid #5a292d;background:#1b1113;color:#c98084;border-radius:7px;padding:8px 10px;font-size:10px;margin:8px 0}
    /* modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modal-backdrop.open{display:flex}
    .modal{width:min(520px,100%);border:1px solid #343b43;background:#111418;border-radius:10px;box-shadow:0 28px 60px rgba(0,0,0,.48);overflow:hidden}.modal-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.modal-title{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.11em;font-weight:800}.close{border:0;background:transparent;color:var(--muted);font-size:18px}.form{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;border:1px solid #30363d;background:#0d1013;color:var(--text);border-radius:6px;padding:8px;outline:none}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#694047;box-shadow:0 0 0 2px rgba(142,32,39,.1)}.modal-actions{padding:10px 12px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px}.primary{border:1px solid #6e2c32;background:#281417;color:#e8d8d9;border-radius:6px;padding:7px 11px}.primary:hover{background:#35171b}.secondary{border:1px solid #343b43;background:#15191e;color:#9ca3aa;border-radius:6px;padding:7px 11px}
    @media(max-width:1100px){.card-grid{grid-template-columns:repeat(4,1fr)}.habit-grid{grid-template-columns:repeat(3,1fr)}.span-4{grid-column:span 6}.quick-row{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.shell{padding:10px}.brand{min-width:0}.status{display:none}.topbar{gap:8px}.nav-btn{padding:6px 8px}.card-grid,.soccer-grid{grid-template-columns:repeat(2,1fr)}.binder-grid{grid-template-columns:repeat(2,1fr)}.habit-grid{grid-template-columns:repeat(2,1fr)}.span-8,.span-6,.span-4,.span-3{grid-column:span 12}.metric-grid{grid-template-columns:repeat(2,1fr)}.collection-launch{grid-template-columns:repeat(2,1fr)}.calendar-wrap{margin:0 -10px}.page-title{font-size:14px}.collections-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-main">HOME</span><span class="jp">ホーム</span></div>
    <nav class="nav">
      <button class="nav-btn active" data-route="home">Home</button>
      <button class="nav-btn" data-route="collections">Collections</button>
    </nav>
    <div class="status" id="clock">SYSTEM // <strong>ONLINE</strong></div>
  </header>
  <main id="app"><div class="loading">INITIALIZING // システム起動中</div></main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="modalTitle">NEW ITEM</div><button class="close" id="modalClose">×</button></div>
    <form id="quickForm" class="form"></form>
    <div class="modal-actions"><button class="secondary" id="modalCancel">CANCEL</button><button class="primary" id="modalSave">SAVE</button></div>
  </div>
</div>

<script>
const STATE = {
  route:'__INITIAL_VIEW__', bootstrap:null, weekOffset:0,
  collectionTab:'wishlist', collectionCache:{},
  pokemonGen:'1', pokemonFilter:'all', wishlistCategory:'all', onePiecePage:'all',
  modalType:null
};
const LINKS = {
  health:'https://app.notion.com/p/3ea2911394258117a53ae060d1541d21',
  school:'https://app.notion.com/p/3ee291139425811baf35d4a5b303ae6b',
  projects:'https://app.notion.com/p/3ea2911394258152a31ee7240412fe64',
  collections:'https://app.notion.com/p/3ea29113942581baa19ff6a63c468344'
};
const GEN_COLORS={1:'#8E3E42',2:'#A8642A',3:'#A88D3E',4:'#4E725C',5:'#536979',6:'#6E547A',7:'#8A526C',8:'#79634F',9:'#73777C'};

function server(method,...args){
  return new Promise((resolve,reject)=>{
    try{
      const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err && err.message ? err.message : String(err))));
      runner[method](...args);
    }catch(e){reject(e)}
  });
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function attr(s){return esc(s).replace(/`/g,'&#096;')}
function fmtDate(v,opts={month:'short',day:'2-digit'}){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':new Intl.DateTimeFormat('en-US',opts).format(d)}
function fmtTime(v){if(!v)return'';return new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(new Date(v))}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function startDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function setting(name){return (STATE.bootstrap?.settings||[]).find(x=>x.setting===name)}
function settingNum(name,fallback){const x=setting(name);return x && x.number!=null?Number(x.number):fallback}
function settingVal(name,fallback){const x=setting(name);return x && x.value?x.value:fallback}
function applyTheme(){
  const r=document.documentElement.style;
  r.setProperty('--bg',settingVal('Background','#0B0D0F'));r.setProperty('--panel',settingVal('Panel','#111418'));r.setProperty('--panel2',settingVal('Raised Panel','#171B20'));r.setProperty('--border',settingVal('Border','#292E35'));r.setProperty('--text',settingVal('Text','#E5E2DC'));r.setProperty('--muted',settingVal('Muted Text','#747A80'));r.setProperty('--red',settingVal('Primary Accent','#8E2027'));
}
function updateClock(){const n=new Date();document.getElementById('clock').innerHTML=`${new Intl.DateTimeFormat('en-US',{month:'short',day:'2-digit'}).format(n).toUpperCase()} // <strong>${new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit'}).format(n)}</strong>`}
setInterval(updateClock,30000);updateClock();

document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.route)));
function navigate(route){STATE.route=route;document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));if(route==='collections')renderCollections();else renderHome();}

async function init(){
  try{STATE.bootstrap=await server('getBootstrapData');applyTheme();navigate(STATE.route);if(STATE.bootstrap.errors?.length)console.warn(STATE.bootstrap.errors)}catch(e){document.getElementById('app').innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

function panel(title,jp,body,opts={}){return `<section class="panel ${opts.className||''}"><div class="panel-head"><div class="panel-title">${esc(title)} <span class="jp">${esc(jp||'')}</span></div>${opts.right||''}</div>${body}</section>`}
function renderHome(){
  const b=STATE.bootstrap||{};const root=document.getElementById('app');
  let html='<div class="home-grid">';
  html+=`<div class="span-12">${calendarPanel(b.calendar)}</div>`;
  html+=`<div class="span-12">${quickPanel()}</div>`;
  html+=`<div class="span-12">${habitsPanel(b.habits||[])}</div>`;
  html+=`<div class="span-8">${focusPanel(b.focus||[])}</div>`;
  html+=`<div class="span-4">${healthPanel(b.health)}</div>`;
  html+=`<div class="span-4">${schoolPanel(b.school||[])}</div>`;
  html+=`<div class="span-4">${projectPanel(b.projects||[])}</div>`;
  html+=`<div class="span-4">${collectionLaunchPanel()}</div>`;
  html+='</div>';
  if(b.errors?.length)html+=`<div class="error">Some modules could not load: ${esc(b.errors.join(' · '))}</div>`;
  root.innerHTML=html;bindHome();
}
function bindHome(){
  document.querySelectorAll('[data-quick]').forEach(x=>x.onclick=()=>openQuick(x.dataset.quick));
  document.querySelectorAll('[data-habit]').forEach(x=>x.onclick=()=>toggleHabitUI(x.dataset.habit));
  document.querySelectorAll('[data-week]').forEach(x=>x.onclick=()=>changeWeek(Number(x.dataset.week)));
  document.querySelectorAll('[data-open-route]').forEach(x=>x.onclick=()=>navigate(x.dataset.openRoute));
}

function quickPanel(){return panel('QUICK CAPTURE','即時入力',`<div class="panel-body"><div class="quick-row">
  <button class="action-btn" data-quick="task"><span class="label">NEW TASK</span><span class="mark">＋</span></button>
  <button class="action-btn" data-quick="school_task"><span class="label">SCHOOL TASK</span><span class="mark">＋</span></button>
  <button class="action-btn" data-quick="note"><span class="label">NEW NOTE</span><span class="mark">＋</span></button>
  <button class="action-btn" data-quick="wishlist"><span class="label">WISHLIST</span><span class="mark">＋</span></button>
</div></div>`)}
function habitsPanel(habits){
  const body=habits.length?`<div class="panel-body"><div class="habit-grid">${habits.map((h,i)=>`<div class="habit"><div class="habit-name">${esc(h.name)}</div><button class="toggle ${h.done?'on':''}" data-habit="${i}" title="${h.done?'Undo today':'Complete today'}"></button></div>`).join('')}</div></div>`:`<div class="empty">NO HABITS AVAILABLE</div>`;
  return panel('HABITS','習慣',body,{right:`<div class="panel-sub">CLICK AGAIN TO UNDO</div>`});
}
async function toggleHabitUI(index){const h=STATE.bootstrap.habits[Number(index)];if(!h)return;try{const res=await server('toggleHabit',{cardId:h.cardId,habitId:h.habitId,logId:h.logId});h.done=res.done;h.logId=res.logId;renderHome()}catch(e){alert(e.message)}}
function focusPanel(tasks){const n=settingNum('Focus Count',5);const show=tasks.slice(0,n);const body=show.length?`<div class="panel-body task-list">${show.map((t,i)=>taskRow(t,i)).join('')}</div>`:`<div class="empty">FOCUS QUEUE CLEAR</div>`;return panel('FOCUS','優先',body,{right:`<div class="panel-sub">${show.length} ACTIVE</div>`})}
function taskRow(t,i){const due=t.due?new Date(t.due):null;const overdue=due&&due<startDay(new Date());return `<a class="task-row" href="${attr(t.url||'#')}"><div class="task-num">${String(i+1).padStart(2,'0')}</div><div><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span class="priority-${String(t.priority||'').toLowerCase()}">${esc(t.priority||'')}</span>${t.area?' · '+esc(t.area):''}</div></div><div class="due ${overdue?'overdue':''}">${t.due?fmtDate(t.due,{month:'short',day:'2-digit'}).toUpperCase():'—'}</div></a>`}
function healthPanel(h){if(!h||!h.latest)return panel('HEALTH','健康','<div class="empty">NO RECENT CHECK-IN</div>');const x=h.latest;const metrics=[['WEIGHT',x.weight!=null?x.weight+' LB':'—',h.weightTrend30d!=null?(h.weightTrend30d>0?'+':'')+h.weightTrend30d+' / 30D':''],['SLEEP',x.sleepHours!=null?x.sleepHours+' H':'—',x.sleepScore!=null?'SCORE '+x.sleepScore:''],['HRV',x.hrv??'—',''],['REST HR',x.restingHR??'—','BPM'],['STEPS',x.steps!=null?Number(x.steps).toLocaleString():'—',''],['PROTEIN',x.protein!=null?x.protein+' G':'—','']];return panel('HEALTH','健康',`<div class="panel-body"><div class="metric-grid">${metrics.map(m=>`<div class="metric"><div class="metric-k">${m[0]}</div><div class="metric-v">${esc(m[1])}</div><div class="metric-d">${esc(m[2])}</div></div>`).join('')}</div></div>`,{right:`<a class="panel-sub" href="${LINKS.health}">OPEN ↗</a>`})}
function schoolPanel(tasks){const show=tasks.slice(0,4);return panel('SCHOOL','学業',show.length?`<div class="panel-body task-list">${show.map((t,i)=>taskRow(t,i)).join('')}</div>`:`<div class="empty">NO OPEN SCHOOL TASKS</div>`,{right:`<a class="panel-sub" href="${LINKS.school}">OPEN ↗</a>`})}
function projectPanel(projects){const p=projects[0];if(!p)return panel('PROJECTS','計画','<div class="empty">NO ACTIVE PROJECT</div>');const progress=p.progress==null?null:Math.max(0,Math.min(1,Number(p.progress)));return panel('PROJECTS','計画',`<div class="panel-body project-card"><div class="project-name">${esc(p.name)}</div><div class="tagline">${p.phase?`<span class="tag">${esc(p.phase)}</span>`:''}${p.priority?`<span class="tag">${esc(p.priority)}</span>`:''}${p.targetDate?`<span class="tag">${fmtDate(p.targetDate).toUpperCase()}</span>`:''}</div>${p.summary?`<div class="project-summary">${esc(p.summary)}</div>`:''}${progress!=null?`<div class="progress"><i style="width:${Math.round(progress*100)}%"></i></div>`:''}</div>`,{right:`<a class="panel-sub" href="${LINKS.projects}">OPEN ↗</a>`})}
function collectionLaunchPanel(){return panel('COLLECTIONS','収集',`<div class="panel-body"><div class="collection-launch">
  <button class="launch-card" data-open-route="collections" onclick="STATE.collectionTab='wishlist'"><div class="launch-title">WISHLIST</div><div class="launch-jp">欲しい物</div><div class="launch-note">LIVE FROM SHEET</div></button>
  <button class="launch-card" data-open-route="collections" onclick="STATE.collectionTab='soccer'"><div class="launch-title">SOCCER</div><div class="launch-jp">ユニフォーム</div><div class="launch-note">4-COLUMN VIEW</div></button>
  <button class="launch-card" data-open-route="collections" onclick="STATE.collectionTab='pokemon'"><div class="launch-title">POKÉMON</div><div class="launch-jp">世代</div><div class="launch-note">GEN I–IX</div></button>
  <button class="launch-card" data-open-route="collections" onclick="STATE.collectionTab='onepiece'"><div class="launch-title">ONE PIECE</div><div class="launch-jp">ページ</div><div class="launch-note">BINDER PAGES</div></button>
</div></div>`)}

function calendarPanel(cal){
  if(!cal)return panel('WEEK','週間','<div class="empty">CALENDAR UNAVAILABLE</div>');
  const startHour=settingNum('Calendar Start Hour',9),endHour=settingNum('Calendar End Hour',24),hourH=34,totalH=(endHour-startHour)*hourH;
  const weekStart=new Date(cal.weekStart);const days=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d});
  const now=new Date();
  const headers=days.map(d=>`<div class="cal-head-cell ${sameDay(d,now)?'today':''}"><b>${new Intl.DateTimeFormat('en-US',{weekday:'short'}).format(d).toUpperCase()}</b>${new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'}).format(d).toUpperCase()}</div>`).join('');
  const all=days.map(d=>`<div class="all-day-cell">${calendarDayEvents(cal.events,d,'all',startHour,endHour).map(e=>`<div class="all-chip" style="border-left-color:${attr(e.color||'#536979')}">${esc(e.title)}</div>`).join('')}</div>`).join('');
  const midnight=days.map(d=>`<div class="midnight-cell">${calendarDayEvents(cal.events,d,'midnight',startHour,endHour).map(e=>`<div class="mid-chip" style="border-left-color:${attr(e.color||'#8E2027')}">${esc(e.title)}</div>`).join('')}</div>`).join('');
  const timeLabels=Array.from({length:endHour-startHour},(_,i)=>`<div class="time-label" style="top:${i*hourH}px">${formatHour(startHour+i)}</div>`).join('');
  const dayCols=days.map(d=>`<div class="day-col ${sameDay(d,now)?'today':''}" style="height:${totalH}px">${hourLines(startHour,endHour,hourH)}${renderTimedEvents(cal.events,d,startHour,endHour,hourH)}${renderNow(d,now,startHour,endHour,hourH)}</div>`).join('');
  const right=`<div class="cal-toolbar"><button class="ghost-btn" data-week="${STATE.weekOffset-1}">‹</button><button class="ghost-btn" data-week="0">TODAY</button><button class="ghost-btn" data-week="${STATE.weekOffset+1}">›</button></div>`;
  return panel('WEEK','週間',`<div class="calendar-wrap"><div class="cal-header"><div></div>${headers}</div><div class="all-day-row"><div class="rail-label">ALL</div>${all}</div><div class="cal-main"><div class="time-col" style="height:${totalH}px">${timeLabels}</div><div class="days-grid">${dayCols}</div></div><div class="midnight-row"><div class="rail-label">12 AM</div>${midnight}</div></div>`,{right});
}
function formatHour(h){const x=h%24;if(x===0)return'12 AM';if(x===12)return'12 PM';return x>12?(x-12)+' PM':x+' AM'}
function hourLines(s,e,h){let out='';for(let i=0;i<e-s;i++){out+=`<div class="hour-line" style="top:${i*h}px"></div><div class="half-line" style="top:${i*h+h/2}px"></div>`}return out}
function calendarDayEvents(events,day,type,startHour,endHour){const ds=startDay(day),de=new Date(ds);de.setDate(de.getDate()+1);return (events||[]).filter(e=>{const s=new Date(e.start),en=new Date(e.end);if(!(s<de&&en>ds))return false;if(type==='all')return e.allDay;if(type==='midnight')return !e.allDay&&s.getTime()===ds.getTime();return false})}
function renderTimedEvents(events,day,startHour,endHour,hourH){const ds=startDay(day),de=new Date(ds);de.setDate(de.getDate()+1);const visStart=new Date(ds);visStart.setHours(startHour,0,0,0);const visEnd=new Date(ds);visEnd.setHours(endHour===24?24:endHour,0,0,0);return (events||[]).map(e=>{if(e.allDay)return'';const s=new Date(e.start),en=new Date(e.end);if(!(s<de&&en>ds))return'';if(s.getTime()===ds.getTime())return'';const a=new Date(Math.max(s,visStart)),b=new Date(Math.min(en,visEnd));if(b<=a)return'';const top=((a-visStart)/60000)/60*hourH,height=Math.max(16,((b-a)/60000)/60*hourH);return `<div class="cal-event" style="top:${top}px;height:${height}px;border-left-color:${attr(e.color||'#536979')}"><div class="ev-title">${esc(e.title)}</div>${height>24?`<div class="ev-time">${fmtTime(s)}–${fmtTime(en)}</div>`:''}</div>`}).join('')}
function renderNow(day,now,startHour,endHour,hourH){if(!sameDay(day,now))return'';const mins=now.getHours()*60+now.getMinutes(),start=startHour*60,end=endHour*60;if(mins<start||mins>end)return'';return `<div class="now-line" style="top:${((mins-start)/60)*hourH}px"></div>`}
async function changeWeek(offset){STATE.weekOffset=offset;try{STATE.bootstrap.calendar=await server('getCalendarWeek',offset);renderHome()}catch(e){alert(e.message)}}

async function renderCollections(){
  const root=document.getElementById('app');root.innerHTML=`<div class="collections-head"><div><div class="page-title">COLLECTIONS // 収集</div><div class="panel-sub" style="margin-top:5px">LIVE VIEWS FROM YOUR GOOGLE SHEETS</div></div><div class="tabs">${collectionTabs()}</div></div><div id="collectionBody"><div class="loading">LOADING COLLECTION // データ読込</div></div>`;
  bindCollectionTabs();await loadCollection(STATE.collectionTab);
}
function collectionTabs(){return [['wishlist','WISHLIST'],['soccer','SOCCER'],['pokemon','POKÉMON'],['onepiece','ONE PIECE']].map(x=>`<button class="chip ${STATE.collectionTab===x[0]?'active':''}" data-coltab="${x[0]}">${x[1]}</button>`).join('')}
function bindCollectionTabs(){document.querySelectorAll('[data-coltab]').forEach(b=>b.onclick=async()=>{STATE.collectionTab=b.dataset.coltab;document.querySelectorAll('[data-coltab]').forEach(x=>x.classList.toggle('active',x.dataset.coltab===STATE.collectionTab));await loadCollection(STATE.collectionTab)})}
async function loadCollection(kind){const body=document.getElementById('collectionBody');body.innerHTML='<div class="loading">LOADING // 読込中</div>';try{let key=kind;if(kind==='pokemon')key+=':'+STATE.pokemonGen;let data=STATE.collectionCache[key];if(!data){data=await server('getCollectionData',kind,kind==='pokemon'?{generation:STATE.pokemonGen}:{ });STATE.collectionCache[key]=data}renderCollectionData(data)}catch(e){body.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderCollectionData(data){if(data.kind==='wishlist')renderWishlist(data);if(data.kind==='soccer')renderSoccer(data);if(data.kind==='pokemon')renderPokemon(data);if(data.kind==='onepiece')renderOnePiece(data)}
function imgBlock(url,label){return `<div class="image-wrap">${url?`<img loading="lazy" src="${attr(url)}" alt="${attr(label||'')}">`:`<div class="image-fallback">IMAGE<br>NOT AVAILABLE</div>`}</div>`}
function renderWishlist(data){const body=document.getElementById('collectionBody');const cats=['all',...(data.categories||[])];let items=data.items||[];if(STATE.wishlistCategory!=='all')items=items.filter(x=>x.category===STATE.wishlistCategory);body.innerHTML=`<div class="collection-tools">${cats.map(c=>`<button class="chip ${STATE.wishlistCategory===c?'active':''}" data-wcat="${attr(c)}">${esc(c==='all'?'ALL':c.toUpperCase())}</button>`).join('')}</div><div class="card-grid">${items.map(x=>`<article class="visual-card">${imgBlock(x.image,x.name)}<div class="card-content"><div class="card-title">${esc(x.name)}</div><div class="card-meta">${esc(x.category)}${x.store?' · '+esc(x.store):''}</div>${x.price?`<div class="card-price">${esc(x.price)}</div>`:''}${x.link?`<div class="card-actions"><a class="card-link" href="${attr(x.link)}">OPEN ↗</a></div>`:''}</div></article>`).join('')}</div>`;document.querySelectorAll('[data-wcat]').forEach(b=>b.onclick=()=>{STATE.wishlistCategory=b.dataset.wcat;renderWishlist(data)})}
function renderSoccer(data){document.getElementById('collectionBody').innerHTML=`<div class="collection-tools"><span class="panel-sub">4-COLUMN SHEET ORDER // TEAM COLORS PRESERVED AS ACCENTS</span></div><div class="card-grid soccer-grid">${(data.items||[]).map(x=>`<article class="visual-card soccer-card" style="--team:${attr(x.accent)}">${imgBlock(x.image,x.name)}<div class="card-content"><div class="card-title">${esc(x.name)}</div>${x.price?`<div class="card-price">${esc(x.price)}</div>`:''}</div></article>`).join('')}</div>`}
function renderPokemon(data){const body=document.getElementById('collectionBody');let items=data.items||[];if(STATE.pokemonFilter==='owned')items=items.filter(x=>x.owned);if(STATE.pokemonFilter==='missing')items=items.filter(x=>!x.owned);body.innerHTML=`<div class="collection-tools"><button class="chip ${STATE.pokemonGen==='all'?'active':''}" data-gen="all">ALL</button>${(data.generations||[]).map(g=>`<button class="chip ${STATE.pokemonGen===g?'active':''}" data-gen="${g}" style="border-bottom-color:${GEN_COLORS[g]}">GEN ${g}</button>`).join('')}<span style="width:8px"></span>${['all','owned','missing'].map(f=>`<button class="chip ${STATE.pokemonFilter===f?'active':''}" data-pfilter="${f}">${f.toUpperCase()}</button>`).join('')}</div><div class="card-grid">${items.map(x=>`<article class="visual-card pokemon-card ${x.owned?'':'dim'}" style="--gen:${GEN_COLORS[x.generation]||'#73777C'}"><div class="status-mark ${x.owned?'owned':'wanted'}">${x.owned?'OWNED':'MISSING'}</div>${imgBlock(x.image,x.entry)}<div class="card-content"><div class="card-title">${esc(x.entry)}</div><div class="card-meta">${esc(x.dex)} · SLOT ${esc(x.slot||'—')}<br>${esc(x.region)} · GEN ${esc(x.generation)}</div>${x.targetCard?`<div class="card-price">${esc(x.targetCard)}${x.price?' · '+esc(x.price):''}</div>`:''}${x.collectr?`<div class="card-actions"><a class="card-link" href="${attr(x.collectr)}">COLLECTR ↗</a></div>`:''}</div></article>`).join('')}</div>`;document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=async()=>{STATE.pokemonGen=b.dataset.gen;await loadCollection('pokemon')});document.querySelectorAll('[data-pfilter]').forEach(b=>b.onclick=()=>{STATE.pokemonFilter=b.dataset.pfilter;renderPokemon(data)})}
function renderOnePiece(data){const body=document.getElementById('collectionBody');const pages=data.pages||[];const nav=`<button class="chip ${STATE.onePiecePage==='all'?'active':''}" data-oppage="all">ALL</button>${pages.map(p=>`<button class="chip ${String(STATE.onePiecePage)===String(p.page)?'active':''}" data-oppage="${p.page}">${String(p.page).padStart(2,'0')}</button>`).join('')}`;const show=STATE.onePiecePage==='all'?pages:pages.filter(p=>String(p.page)===String(STATE.onePiecePage));body.innerHTML=`<div class="collection-tools">${nav}</div><div class="binder">${show.map(p=>{const owned=p.items.filter(x=>x.owned).length;return `<section class="binder-page"><div class="binder-head"><div class="binder-title">${esc(p.title)}</div><div class="binder-count">${owned}/${p.items.length} OWNED</div></div><div class="binder-grid">${p.items.map(x=>`<article class="visual-card ${x.owned?'':'dim'}"><div class="status-mark ${x.owned?'owned':'wanted'}">${x.owned?'OWNED':'WANTED'}</div>${imgBlock(x.image,x.name)}<div class="card-content"><div class="card-title">${esc(x.name)}</div><div class="card-meta">SLOT ${String(x.position).padStart(2,'0')}${x.set?' · '+esc(x.set):''}${x.affiliation?'<br>'+esc(x.affiliation):''}</div><div class="card-price">${esc(x.engPrice||'')}${x.jpPriceJpy?` · ${esc(x.jpPriceJpy)}`:''}</div><div class="card-actions">${x.tcg?`<a class="card-link" href="${attr(x.tcg)}">ENG ↗</a>`:''}${x.cardrush?`<a class="card-link" href="${attr(x.cardrush)}">JP ↗</a>`:''}</div></div></article>`).join('')}</div></section>`}).join('')}</div>`;document.querySelectorAll('[data-oppage]').forEach(b=>b.onclick=()=>{STATE.onePiecePage=b.dataset.oppage;renderOnePiece(data)})}

function openQuick(type){STATE.modalType=type;const backdrop=document.getElementById('modalBackdrop'),form=document.getElementById('quickForm'),title=document.getElementById('modalTitle');title.textContent=({task:'NEW TASK // 新規',school_task:'SCHOOL TASK // 学業',note:'NEW NOTE // メモ',wishlist:'WISHLIST // 欲しい物'})[type]||'NEW ITEM';form.innerHTML=quickFields(type);backdrop.classList.add('open');setTimeout(()=>form.querySelector('input')?.focus(),40)}
function quickFields(type){if(type==='task'||type==='school_task')return `<div class="field full"><label>Task</label><input name="title" required></div><div class="field"><label>Due</label><input name="due" type="date"></div><div class="field"><label>Priority</label><select name="priority"><option value="">None</option><option>High</option><option>Medium</option><option>Low</option></select></div>${type==='task'?`<div class="field"><label>Area</label><select name="area"><option>Personal</option><option>School</option><option>Health</option><option>Projects</option><option>Collections</option></select></div>`:''}<div class="field full"><label>Details</label><textarea name="details"></textarea></div>`;if(type==='note')return `<div class="field full"><label>Title</label><input name="title" required></div><div class="field"><label>Area</label><select name="area"><option>Personal</option><option>School</option><option>Health</option><option>Projects</option><option>Collections</option></select></div><div class="field"><label>Type</label><select name="noteType"><option>Reference</option><option>Plan</option><option>Research</option><option>Decision</option><option>Test Result</option><option>Meeting Note</option><option>Journal</option></select></div><div class="field full"><label>Body</label><textarea name="body"></textarea></div>`;return `<div class="field full"><label>Item</label><input name="title" required></div><div class="field"><label>Category</label><input name="category" placeholder="Disc Golf, Tech, Clothing…"></div><div class="field"><label>Price</label><input name="price" placeholder="$99.99"></div><div class="field"><label>Store</label><input name="store"></div><div class="field"><label>Want level</label><select name="wantLevel"><option>Interested</option><option>High</option><option>Maybe</option></select></div><div class="field full"><label>Link</label><input name="link" type="url"></div>`}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');STATE.modalType=null}
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalCancel').onclick=e=>{e.preventDefault();closeModal()};document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
document.getElementById('modalSave').onclick=async e=>{e.preventDefault();const form=document.getElementById('quickForm');const fd=new FormData(form),payload={};for(const[k,v]of fd.entries())payload[k]=v;const btn=e.currentTarget;btn.disabled=true;btn.textContent='SAVING…';try{await server('createQuickItem',STATE.modalType,payload);closeModal();if(STATE.modalType==='wishlist'){STATE.collectionCache={};}STATE.bootstrap=await server('getBootstrapData');if(STATE.route==='home')renderHome();else await renderCollections()}catch(err){alert(err.message)}finally{btn.disabled=false;btn.textContent='SAVE'}};
document.addEventListener('keydown',e=>{if(document.getElementById('modalBackdrop').classList.contains('open')){if(e.key==='Escape')closeModal();return}if(e.target.matches('input,textarea,select'))return;if(e.key.toLowerCase()==='t')openQuick('task');if(e.key.toLowerCase()==='n')openQuick('note');if(e.key.toLowerCase()==='c')navigate('collections')});

init();
</script>
