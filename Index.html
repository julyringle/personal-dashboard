<!doctype html>
<html>
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@main/styles.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-main">HOME</span><span class="jp">ホーム</span></div>
    <nav class="nav">
      <button class="nav-btn active" data-route="home">Home</button>
      <button class="nav-btn" data-route="collections">Collections</button>
    </nav>
    <div class="status" id="clock">SYSTEM // <strong>ONLINE</strong></div>
  </header>
  <main id="app"><div class="loading">INITIALIZING // システム起動中</div></main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="modalTitle">NEW ITEM</div><button class="close" id="modalClose">×</button></div>
    <form id="quickForm" class="form"></form>
    <div class="modal-actions"><button class="secondary" id="modalCancel">CANCEL</button><button class="primary" id="modalSave">SAVE</button></div>
  </div>
</div>
<script>window.__INITIAL_VIEW__='__INITIAL_VIEW__';</script>
<script src="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@main/app.js"></script>
</body>
</html>
