<!doctype html>
<html>
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <title>Dashboard</title>
  <link rel="manifest" href="./manifest.webmanifest?v=2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@d0d51608c896788ee6afd48ecc5360a5c69e24b8/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@76c6828a396111511e099c4463204031a63523e1/backgrounds.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@1567cb986cf637e80f8d13b933866ae7b24dc74a/page-backgrounds.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@01ea40e3eb367dfa03f3d4150f05fa9e79bebaee/section-backgrounds.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@0c9950df33d55ab6b7786e7f4a6a1909913ff152/standalone.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-main">HOME</span><span class="jp">ホーム</span></div>
    <nav class="nav">
      <button class="nav-btn active" data-route="home">Home</button>
      <button class="nav-btn" data-route="tasks">Tasks</button>
      <button class="nav-btn" data-route="habits">Habits</button>
      <button class="nav-btn" data-route="health">Health</button>
      <button class="nav-btn" data-route="school">School</button>
      <button class="nav-btn" data-route="projects">Projects</button>
      <button class="nav-btn" data-route="collections">Collections</button>
    </nav>
    <div class="status" id="clock">SYSTEM // <strong>PRIVATE</strong></div>
  </header>
  <main id="app"><div class="loading">INITIALIZING // システム起動中</div></main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="modalTitle">NEW ITEM</div><button class="close" id="modalClose">×</button></div>
    <form id="quickForm" class="form"></form>
    <div class="modal-actions"><button class="secondary" id="modalCancel">CANCEL</button><button class="primary" id="modalSave">SAVE</button></div>
  </div>
</div>
<script>
  const requested=(new URLSearchParams(location.search).get('view')||'home').toLowerCase();
  window.__INITIAL_VIEW__=['home','tasks','habits','health','school','projects','collections'].includes(requested)?requested:'home';
</script>
<script src="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@41ed16f7d50f707fe359e34e9b94de237ca9fea6/standalone.js"></script>
<script src="https://cdn.jsdelivr.net/gh/julyringle/personal-dashboard@e673174c4cf3b1d74268c23ec5d24e0b2e0ebba6/app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
